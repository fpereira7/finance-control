spring.application.name=finance-control

spring.datasource.url=jdbc:postgresql://localhost:5432/finance_control
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT (override via env in non-local environments)
app.jwt.secret=${APP_JWT_SECRET:change-me-dev-secret-must-be-at-least-32-chars}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

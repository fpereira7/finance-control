services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-control-db
    environment:
      POSTGRES_DB: finance_control
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - finance_control_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d finance_control"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finance_control_pgdata:
